  <div class="bg-danger-subtle py-5">
    <div class="container" style="max-width: 650px;">

      <h1 class="text-center fw-bold mb-2 js-order-heading" style="color: #d64550;">Special Order Form</h1>
      <p class="text-center text-secondary small mb-4 js-order-text">Please fill out the form and someone from our team will get back
        to you within 24 hours.</p>


      <form>

        <div class="mb-3 js-order-field">
          <input type="email" class="form-control rounded-pill px-4 py-2 border-secondary-subtle" placeholder="Email">
        </div>

        <div class="mb-3 js-order-field">
          <input type="tel" class="form-control rounded-pill px-4 py-2 border-secondary-subtle"
            placeholder="Phone Number">
        </div>

        <div class="mb-3 js-order-field">
          <input type="text" class="form-control rounded-pill px-4 py-2 border-secondary-subtle" placeholder="Name">
        </div>

        <div class="mb-3 js-order-field">
          <select class="form-select rounded-pill px-4 py-2 border-secondary-subtle text-secondary">
            <option selected disabled>Choose a delivery options</option>
            <option value="1">Home Delivery</option>
            <option value="2">Pickup</option>
          </select>
        </div>


        <div class="row g-3 mb-3 js-order-field">
          <div class="col-6">
            <input type="text" class="form-control rounded-pill px-4 py-2 border-secondary-subtle"
              placeholder="Address 1">
          </div>
          <div class="col-6">
            <input type="text" class="form-control rounded-pill px-4 py-2 border-secondary-subtle"
              placeholder="Address 2">
          </div>
        </div>

        <div class="row g-3 mb-3 js-order-field">
          <div class="col-6">
            <input type="text" class="form-control rounded-pill px-4 py-2 border-secondary-subtle" placeholder="City">
          </div>
          <div class="col-6">
            <input type="text" class="form-control rounded-pill px-4 py-2 border-secondary-subtle"
              placeholder="Zip Code">
          </div>
        </div>


        <div class="mb-4 js-order-field">
          <textarea class="form-control rounded-4 p-4 border-secondary-subtle" rows="6"
            placeholder="Order Detail"></textarea>
        </div>


        <div class="text-center js-order-field">
          <button type="submit" class="btn text-white rounded-pill px-5 py-2 fw-semibold"
            style="background-color: #92d0a4;">Submit</button>
        </div>
      </form>

    </div>
  </div>

<div class="container-fluid bg-light footer">

            <div class="social-media d-flex align-items-center justify-content-center">
